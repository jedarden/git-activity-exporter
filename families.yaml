# Repo -> family. The middle scope tier of the dashboard.
#
# Editorial by design: nothing in a repo's metadata says that `commitgraph`
# and `commitgraph-deprecated` are one programme (2,651 commits between them
# in a 30-day sample, invisible as a single effort unless grouped), or that
# the agent tooling repos belong together. Keep it that way -- a repo listed
# under two families is a hard error, and anything unlisted lands in
# `unassigned` and still appears in the ecosystem and repo tiers.
