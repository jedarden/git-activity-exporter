apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: git-activity-exporter-build
  namespace: argo-workflows
spec:
  arguments:
    parameters:
      - name: git-repo
        value: jedarden/git-activity-exporter
      - name: branch
        value: main
      - name: commit-sha
        value: ""
  entrypoint: build
  synchronization:
    mutexes:
      - name: git-activity-exporter-release
  volumes:
    - name: docker-config
      secret:
        secretName: docker-hub-registry
        items:
          - key: .dockerconfigjson
            path: config.json
  templates:
    - name: build
      steps:
        - - name: test
            template: test
        - - name: resolve-version
            template: resolve-version
        - - name: docker-build
            template: docker-build
            arguments:
              parameters:
                - name: version
                  value: "{{steps.resolve-version.outputs.parameters.version}}"
                - name: source-sha
                  value: "{{steps.resolve-version.outputs.parameters.source-sha}}"
        - - name: self-hosting-smoke
            template: self-hosting-smoke
            arguments:
              parameters:
                - name: version
                  value: "{{steps.resolve-version.outputs.parameters.version}}"
                - name: source-sha
                  value: "{{steps.resolve-version.outputs.parameters.source-sha}}"
        - - name: smoke
            template: smoke
            arguments:
              parameters:
                - name: version
                  value: "{{steps.resolve-version.outputs.parameters.version}}"
        - - name: promote
            template: promote
            arguments:
              parameters:
                - name: version
                  value: "{{steps.resolve-version.outputs.parameters.version}}"
                - name: verified-image
                  value: "{{steps.smoke.outputs.parameters.verified-image}}"
        - - name: verify-rollout
            template: verify-rollout
            arguments:
              parameters:
                - name: version
                  value: "{{steps.resolve-version.outputs.parameters.version}}"
                - name: gitops-revision
                  value: "{{steps.promote.outputs.parameters.gitops-revision}}"
    - name: test
      script:
        image: python:3.12.11-slim
        command: [sh]
        source: |
          set -e
          COMMIT_SHA="{{workflow.parameters.commit-sha}}"
          printf '%s\n' "$COMMIT_SHA" | grep -Eq '^[0-9a-f]{40}$'
          git clone --branch {{workflow.parameters.branch}} \
            "https://git.ardenone.com/{{workflow.parameters.git-repo}}.git" /tmp/repo
          cd /tmp/repo
          git checkout --detach "$COMMIT_SHA"
          test "$(git rev-parse HEAD)" = "$COMMIT_SHA"
          python -m pytest tests/ -q
        env:
          - name: GIT_CONFIG_COUNT
            value: "1"
          - name: GIT_CONFIG_KEY_0
            value: credential.helper
          - name: GIT_CONFIG_VALUE_0
            value: '!f() { test "$1" = get && echo "username=x-token" && echo "password=$FORGEJO_TOKEN"; }; f'
          - name: FORGEJO_TOKEN
            valueFrom:
              secretKeyRef:
                name: forgejo-webhook-token
                key: token
      retryStrategy:
        retryPolicy: OnError
    - name: resolve-version
      script:
        image: alpine/git:v2.54.0
        command: [sh]
        source: |
          set -e
          TRIGGER_SHA="{{workflow.parameters.commit-sha}}"
          printf '%s\n' "$TRIGGER_SHA" | grep -Eq '^[0-9a-f]{40}$'
          git clone --branch {{workflow.parameters.branch}} \
            "https://git.ardenone.com/{{workflow.parameters.git-repo}}.git" \
            /tmp/repo
          cd /tmp/repo
          git checkout --detach "$TRIGGER_SHA"
          test "$(git rev-parse HEAD)" = "$TRIGGER_SHA"

          # A queued or retried run may start after main has moved. Never
          # rebase the tested source onto an unrelated commit: wait for that
          # commit's webhook instead. The one allowed descendant is the
          # resolver's own CI VERSION bump from a prior attempt.
          git fetch origin main
          MAIN_SHA=$(git rev-parse origin/main)
          VERSION=""
          SOURCE_SHA="$TRIGGER_SHA"
          if [ "$MAIN_SHA" != "$TRIGGER_SHA" ]; then
            MAIN_VERSION=$(git show "$MAIN_SHA:VERSION" | tr -d '[:space:]')
            MAIN_SUBJECT=$(git log -1 --format=%s "$MAIN_SHA")
            MAIN_AUTHOR=$(git log -1 --format=%an "$MAIN_SHA")
            if [ "$(git rev-parse "$MAIN_SHA^" 2>/dev/null || true)" = "$TRIGGER_SHA" ] \
              && [ "$MAIN_AUTHOR" = "Argo Workflows CI" ] \
              && [ "$MAIN_SUBJECT" = "ci: auto-bump version to $MAIN_VERSION" ]; then
              VERSION="$MAIN_VERSION"
              SOURCE_SHA="$MAIN_SHA"
              echo "Reusing VERSION bump ${SOURCE_SHA} for trigger ${TRIGGER_SHA}"
            else
              echo "main advanced beyond trigger ${TRIGGER_SHA}; refusing stale release" >&2
              exit 1
            fi
          fi

          VERSION_CHANGED=$(git diff --name-only HEAD~1 HEAD -- VERSION 2>/dev/null | grep -c '^VERSION$' || true)
          CURRENT=$(cat VERSION | tr -d '[:space:]')

          if [ -n "$VERSION" ]; then
            :
          elif [ "$VERSION_CHANGED" -gt 0 ] 2>/dev/null; then
            VERSION="$CURRENT"
            echo "VERSION changed in commit — using ${VERSION}"
          else
            MAJOR=$(echo "$CURRENT" | cut -d. -f1)
            MINOR=$(echo "$CURRENT" | cut -d. -f2)
            PATCH=$(echo "$CURRENT" | cut -d. -f3)
            PATCH=$((PATCH + 1))
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
            echo "Auto-bumping ${CURRENT} → ${VERSION}"
            echo "$VERSION" > VERSION
            git config user.email "github@jedarden.com"
            git config user.name "Argo Workflows CI"
            git add VERSION
            git commit -m "ci: auto-bump version to ${VERSION}"
            # This is intentionally a fast-forward-only write. If main moves
            # after the check, the push fails and a newer webhook owns the
            # next release; pulling/rebasing would build untested source.
            git push origin HEAD:main
            SOURCE_SHA=$(git rev-parse HEAD)
          fi

          echo "$VERSION" > /tmp/version
          echo "$SOURCE_SHA" > /tmp/source-sha
          printf '%s\n' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'
        env:
          - name: GIT_CONFIG_COUNT
            value: "1"
          - name: GIT_CONFIG_KEY_0
            value: credential.helper
          - name: GIT_CONFIG_VALUE_0
            value: '!f() { test "$1" = get && echo "username=x-token" && echo "password=$FORGEJO_TOKEN"; }; f'
          - name: FORGEJO_TOKEN
            valueFrom:
              secretKeyRef:
                name: forgejo-webhook-token
                key: token
      outputs:
        parameters:
          - name: version
            valueFrom:
              path: /tmp/version
          - name: source-sha
            valueFrom:
              path: /tmp/source-sha
    - name: smoke
      inputs:
        parameters:
          - name: version
      container:
        image: ronaldraygun/git-activity-exporter:{{inputs.parameters.version}}
        command: [sh, -c]
        args:
          - |
            set -eu
            IMAGE="ronaldraygun/git-activity-exporter:{{inputs.parameters.version}}"
            test "$(tr -d '[:space:]' < /app/VERSION)" = "{{inputs.parameters.version}}"
            printf '%s\n' "$IMAGE" > /tmp/verified-image
      outputs:
        parameters:
          - name: verified-image
            valueFrom:
              path: /tmp/verified-image
    - name: self-hosting-smoke
      inputs:
        parameters:
          - name: version
          - name: source-sha
      container:
        image: docker:29.7.2-dind
        command: [sh, -c]
        args:
          - |
            set -eu
            dockerd-entrypoint.sh &
            export DOCKER_HOST=unix:///var/run/docker.sock
            apk add --no-cache bash curl git >/dev/null
            for _ in $(seq 1 30); do
              docker info >/dev/null 2>&1 && break
              sleep 2
            done
            docker info >/dev/null
            docker compose version >/dev/null

            git clone --branch {{workflow.parameters.branch}} \
              "https://git.ardenone.com/{{workflow.parameters.git-repo}}.git" /tmp/repo
            cd /tmp/repo
            SOURCE_SHA="{{inputs.parameters.source-sha}}"
            printf '%s\n' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'
            git checkout --detach "$SOURCE_SHA"
            test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
            IMAGE="ronaldraygun/git-activity-exporter:{{inputs.parameters.version}}"
            docker pull "$IMAGE"
            SKIP_BUILD=1 IMAGE="$IMAGE" SMOKE_PYTHON_IMAGE="$IMAGE" \
              scripts/smoke-self-hosting.sh
      securityContext:
        privileged: true
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: "2"
          memory: 2Gi
      retryStrategy:
        retryPolicy: OnError
    - name: promote
      inputs:
        parameters:
          - name: version
          - name: verified-image
      retryStrategy:
        limit: "2"
        retryPolicy: Always
        backoff:
          duration: 5s
          factor: "2"
      script:
        image: alpine/git:v2.54.0
        command: [sh]
        source: |
          set -eu
          VERSION="{{inputs.parameters.version}}"
          VERIFIED_IMAGE="{{inputs.parameters.verified-image}}"
          IMAGE="ronaldraygun/git-activity-exporter:${VERSION}"
          printf '%s\n' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          test "$VERIFIED_IMAGE" = "$IMAGE"
          git clone --branch main --depth 1 \
            "https://git.ardenone.com/jedarden/declarative-config.git" \
            /tmp/declarative-config
          cd /tmp/declarative-config
          MANIFEST=k8s/ardenone-cluster/git-activity-exporter/deployment.yml
          git fetch origin main
          git reset --hard origin/main
          test "$(grep -Ec \
            '^[[:space:]]+image: ronaldraygun/git-activity-exporter:[0-9]+\.[0-9]+\.[0-9]+[[:space:]]*$' \
            "$MANIFEST")" = 1
          sed -i -E \
            "s|(image: ronaldraygun/git-activity-exporter:)[^[:space:]]*|\1${VERSION}|" \
            "$MANIFEST"
          grep -Eq \
            "^[[:space:]]+image: ronaldraygun/git-activity-exporter:${VERSION}[[:space:]]*$" \
            "$MANIFEST"
          git add "$MANIFEST"
          if git diff --cached --quiet; then
            git rev-parse HEAD > /tmp/gitops-revision
            echo "GitOps already references ${VERSION}"
            exit 0
          fi
          test "$(git diff --cached --name-only)" = "$MANIFEST"
          git diff --cached --check
          git config user.email "github@jedarden.com"
          git config user.name "Argo Workflows CI"
          git commit -m "ci(git-activity-exporter): promote image to ${VERSION}"
          git push origin HEAD:main
          git rev-parse HEAD > /tmp/gitops-revision
      outputs:
        parameters:
          - name: gitops-revision
            valueFrom:
              path: /tmp/gitops-revision
      env:
        - name: GIT_CONFIG_COUNT
          value: "1"
        - name: GIT_CONFIG_KEY_0
          value: credential.helper
        - name: GIT_CONFIG_VALUE_0
          value: '!f() { test "$1" = get && echo "username=x-token" && echo "password=$FORGEJO_TOKEN"; }; f'
        - name: GIT_TERMINAL_PROMPT
          value: "0"
        - name: FORGEJO_TOKEN
          valueFrom:
            secretKeyRef:
              name: forgejo-webhook-token
              key: token
    - name: verify-rollout
      inputs:
        parameters:
          - name: version
          - name: gitops-revision
      script:
        image: alpine/k8s:1.37.0
        command: [sh]
        source: |
          set -eu
          VERSION="{{inputs.parameters.version}}"
          printf '%s\n' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          printf '%s\n' "{{inputs.parameters.gitops-revision}}" | grep -Eq '^[0-9a-f]{40}$'
          IMAGE="ronaldraygun/git-activity-exporter:${VERSION}"
          curl -fsS https://argocd-ro-ardenone-manager-ts.ardenone.com:8444/api/v1/applications/git-activity-exporter-ns-ardenone-cluster
          kubectl --server=http://ardenone-cluster-traefik:8001 get deployment git-activity-exporter
    - name: docker-build
      metadata:
        labels:
          ci.ardenone.com/buildkit-client: "true"
      inputs:
        parameters:
          - name: version
          - name: source-sha
      retryStrategy:
        limit: "2"
        retryPolicy: Always
        backoff:
          duration: 5s
          factor: "2"
      container:
        image: moby/buildkit:v0.33.0-rootless@sha256:80b15f0735e87bab7bf59ec4d695dfb4a7cfb25521cf56dc75d6f256285b63ef
        command: [/bin/sh, -ec]
        args:
          - |
            CONTEXT="https://git.ardenone.com/{{workflow.parameters.git-repo}}.git#{{inputs.parameters.source-sha}}"
            buildctl --addr tcp://acb-buildkitd:1234 --wait build \
              --progress=plain \
              --frontend=dockerfile.v0 \
              --opt "context=${CONTEXT}" \
              --opt filename=Dockerfile \
              --opt "build-arg:VERSION={{inputs.parameters.version}}" \
              --secret id=GIT_AUTH_TOKEN,env=GIT_AUTH_TOKEN \
              --output "type=image,name=ronaldraygun/git-activity-exporter:{{inputs.parameters.version}},push=true"
        env:
          - name: DOCKER_CONFIG
            value: /home/user/.docker
          - name: GIT_AUTH_TOKEN
            valueFrom:
              secretKeyRef:
                name: forgejo-webhook-token
                key: token
        volumeMounts:
          - name: docker-config
            mountPath: /home/user/.docker
            readOnly: true
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
            ephemeral-storage: 64Mi
          limits:
            cpu: 500m
            memory: 512Mi
            ephemeral-storage: 256Mi
