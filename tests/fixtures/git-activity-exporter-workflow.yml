apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: git-activity-exporter-build
  namespace: argo-workflows
spec:
  arguments:
    parameters:
      - name: git-repo
        value: jedarden/git-activity-exporter
      - name: branch
        value: main
  entrypoint: build
  synchronization:
    mutexes:
      - name: git-activity-exporter-release
  volumes:
    - name: docker-config
      secret:
        secretName: docker-hub-registry
        items:
          - key: .dockerconfigjson
            path: config.json
  templates:
    - name: build
      steps:
        - - name: test
            template: test
        - - name: resolve-version
            template: resolve-version
        - - name: docker-build
            template: docker-build
            arguments:
              parameters:
                - name: version
                  value: "{{steps.resolve-version.outputs.parameters.version}}"
        - - name: self-hosting-smoke
            template: self-hosting-smoke
            arguments:
              parameters:
                - name: version
                  value: "{{steps.resolve-version.outputs.parameters.version}}"
        - - name: smoke
            template: smoke
            arguments:
              parameters:
                - name: version
                  value: "{{steps.resolve-version.outputs.parameters.version}}"
        - - name: promote
            template: promote
            arguments:
              parameters:
                - name: version
                  value: "{{steps.resolve-version.outputs.parameters.version}}"
                - name: verified-image
                  value: "{{steps.smoke.outputs.parameters.verified-image}}"
        - - name: verify-rollout
            template: verify-rollout
            arguments:
              parameters:
                - name: version
                  value: "{{steps.resolve-version.outputs.parameters.version}}"
                - name: gitops-revision
                  value: "{{steps.promote.outputs.parameters.gitops-revision}}"
    - name: test
      script:
        image: python:3.12.11-slim
        command: [sh]
        source: |
          set -e
          git clone --depth 1 --branch {{workflow.parameters.branch}} \
            "https://git.ardenone.com/{{workflow.parameters.git-repo}}.git" /tmp/repo
          cd /tmp/repo
          python -m pytest tests/ -q
        env:
          - name: GIT_CONFIG_COUNT
            value: "1"
          - name: GIT_CONFIG_KEY_0
            value: credential.helper
          - name: GIT_CONFIG_VALUE_0
            value: '!f() { test "$1" = get && echo "username=x-token" && echo "password=$FORGEJO_TOKEN"; }; f'
          - name: FORGEJO_TOKEN
            valueFrom:
              secretKeyRef:
                name: forgejo-webhook-token
                key: token
      retryStrategy:
        retryPolicy: OnError
    - name: resolve-version
      script:
        image: alpine/git:v2.54.0
        command: [sh]
        source: |
          set -e
          git clone --branch {{workflow.parameters.branch}} \
            "https://git.ardenone.com/{{workflow.parameters.git-repo}}.git" \
            /tmp/repo
          cd /tmp/repo

          VERSION_CHANGED=$(git diff --name-only HEAD~1 HEAD -- VERSION 2>/dev/null | grep -c '^VERSION$' || true)
          CURRENT=$(cat VERSION | tr -d '[:space:]')
          LAST_AUTO_BUMP=$(git log -1 --format=%s | sed -n \
            's/^ci: auto-bump version to //p')

          if [ "$LAST_AUTO_BUMP" = "$CURRENT" ]; then
            VERSION="$CURRENT"
            echo "Reusing existing auto-bump commit for ${VERSION}"
          elif [ "$VERSION_CHANGED" -gt 0 ] 2>/dev/null; then
            VERSION="$CURRENT"
            echo "VERSION changed in commit — using ${VERSION}"
          else
            MAJOR=$(echo "$CURRENT" | cut -d. -f1)
            MINOR=$(echo "$CURRENT" | cut -d. -f2)
            PATCH=$(echo "$CURRENT" | cut -d. -f3)
            PATCH=$((PATCH + 1))
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
            echo "Auto-bumping ${CURRENT} → ${VERSION}"
            echo "$VERSION" > VERSION
            git config user.email "github@jedarden.com"
            git config user.name "Argo Workflows CI"
            git add VERSION
            git commit -m "ci: auto-bump version to ${VERSION}"
            PUSHED=false
            for i in 1 2 3; do
              if git pull --rebase && git push; then
                PUSHED=true
                break
              fi
              echo "Push attempt $i failed, retrying..."
              sleep 3
            done
            test "$PUSHED" = true
          fi

          echo "$VERSION" > /tmp/version
        env:
          - name: GIT_CONFIG_COUNT
            value: "1"
          - name: GIT_CONFIG_KEY_0
            value: credential.helper
          - name: GIT_CONFIG_VALUE_0
            value: '!f() { test "$1" = get && echo "username=x-token" && echo "password=$FORGEJO_TOKEN"; }; f'
          - name: FORGEJO_TOKEN
            valueFrom:
              secretKeyRef:
                name: forgejo-webhook-token
                key: token
    - name: smoke
      inputs:
        parameters:
          - name: version
      container:
        image: ronaldraygun/git-activity-exporter:{{inputs.parameters.version}}
        command: [sh, -c]
        args:
          - |
            set -eu
            IMAGE="ronaldraygun/git-activity-exporter:{{inputs.parameters.version}}"
            test "$(tr -d '[:space:]' < /app/VERSION)" = "{{inputs.parameters.version}}"
            printf '%s\n' "$IMAGE" > /tmp/verified-image
      outputs:
        parameters:
          - name: verified-image
            valueFrom:
              path: /tmp/verified-image
    - name: self-hosting-smoke
      inputs:
        parameters:
          - name: version
      container:
        image: docker:29.7.2-dind
        command: [sh, -c]
        args:
          - |
            set -eu
            dockerd-entrypoint.sh &
            export DOCKER_HOST=unix:///var/run/docker.sock
            apk add --no-cache bash curl git >/dev/null
            for _ in $(seq 1 30); do
              docker info >/dev/null 2>&1 && break
              sleep 2
            done
            docker info >/dev/null
            docker compose version >/dev/null

            git clone --depth 1 --branch {{workflow.parameters.branch}} \
              "https://git.ardenone.com/{{workflow.parameters.git-repo}}.git" /tmp/repo
            cd /tmp/repo
            IMAGE="ronaldraygun/git-activity-exporter:{{inputs.parameters.version}}"
            docker pull "$IMAGE"
            SKIP_BUILD=1 IMAGE="$IMAGE" SMOKE_PYTHON_IMAGE="$IMAGE" \
              scripts/smoke-self-hosting.sh
      securityContext:
        privileged: true
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: "2"
          memory: 2Gi
      retryStrategy:
        retryPolicy: OnError
    - name: promote
      inputs:
        parameters:
          - name: version
          - name: verified-image
      retryStrategy:
        limit: "2"
        retryPolicy: Always
        backoff:
          duration: 5s
          factor: "2"
      script:
        image: alpine/git:v2.54.0
        command: [sh]
        source: |
          set -eu
          VERSION="{{inputs.parameters.version}}"
          VERIFIED_IMAGE="{{inputs.parameters.verified-image}}"
          IMAGE="ronaldraygun/git-activity-exporter:${VERSION}"
          printf '%s\n' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          test "$VERIFIED_IMAGE" = "$IMAGE"
          git clone --branch main --depth 1 \
            "https://git.ardenone.com/jedarden/declarative-config.git" \
            /tmp/declarative-config
          cd /tmp/declarative-config
          MANIFEST=k8s/ardenone-cluster/git-activity-exporter/deployment.yml
          git fetch origin main
          git reset --hard origin/main
          test "$(grep -Ec \
            '^[[:space:]]+image: ronaldraygun/git-activity-exporter:[0-9]+\.[0-9]+\.[0-9]+[[:space:]]*$' \
            "$MANIFEST")" = 1
          sed -i -E \
            "s|(image: ronaldraygun/git-activity-exporter:)[^[:space:]]*|\1${VERSION}|" \
            "$MANIFEST"
          grep -Eq \
            "^[[:space:]]+image: ronaldraygun/git-activity-exporter:${VERSION}[[:space:]]*$" \
            "$MANIFEST"
          git add "$MANIFEST"
          if git diff --cached --quiet; then
            git rev-parse HEAD > /tmp/gitops-revision
            echo "GitOps already references ${VERSION}"
            exit 0
          fi
          test "$(git diff --cached --name-only)" = "$MANIFEST"
          git diff --cached --check
          git config user.email "github@jedarden.com"
          git config user.name "Argo Workflows CI"
          git commit -m "ci(git-activity-exporter): promote image to ${VERSION}"
          git push origin HEAD:main
          git rev-parse HEAD > /tmp/gitops-revision
      outputs:
        parameters:
          - name: gitops-revision
            valueFrom:
              path: /tmp/gitops-revision
      env:
        - name: GIT_CONFIG_COUNT
          value: "1"
        - name: GIT_CONFIG_KEY_0
          value: credential.helper
        - name: GIT_CONFIG_VALUE_0
          value: '!f() { test "$1" = get && echo "username=x-token" && echo "password=$FORGEJO_TOKEN"; }; f'
        - name: GIT_TERMINAL_PROMPT
          value: "0"
        - name: FORGEJO_TOKEN
          valueFrom:
            secretKeyRef:
              name: forgejo-webhook-token
              key: token
    - name: verify-rollout
      inputs:
        parameters:
          - name: version
          - name: gitops-revision
      script:
        image: alpine/k8s:1.37.0
        command: [sh]
        source: |
          set -eu
          VERSION="{{inputs.parameters.version}}"
          printf '%s\n' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          printf '%s\n' "{{inputs.parameters.gitops-revision}}" | grep -Eq '^[0-9a-f]{40}$'
          IMAGE="ronaldraygun/git-activity-exporter:${VERSION}"
          curl -fsS https://argocd-ro-ardenone-manager-ts.ardenone.com:8444/api/v1/applications/git-activity-exporter-ns-ardenone-cluster
          kubectl --server=http://ardenone-cluster-traefik:8001 get deployment git-activity-exporter
    - name: docker-build
      inputs:
        parameters:
          - name: version
      retryStrategy:
        limit: "2"
        retryPolicy: Always
        backoff:
          duration: 5s
          factor: "2"
      container:
        image: gcr.io/kaniko-project/executor:v1.23.2
        args:
          - --context=git://git.ardenone.com/{{workflow.parameters.git-repo}}.git#refs/heads/{{workflow.parameters.branch}}
          - --dockerfile=Dockerfile
          - --destination=ronaldraygun/git-activity-exporter:{{inputs.parameters.version}}
          - --build-arg=VERSION={{inputs.parameters.version}}
          - --cache=true
          - --cache-repo=ronaldraygun/cache
        env:
          - name: GIT_USERNAME
            value: x-token
          - name: GIT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: forgejo-webhook-token
                key: token
        volumeMounts:
          - name: docker-config
            mountPath: /kaniko/.docker
