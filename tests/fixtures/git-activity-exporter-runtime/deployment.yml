---
# Publishes fleet git + bead activity as Parquet for
# dashboard.ardenone.com/git-activity/.
#
# A Deployment with an internal poll loop, not a CronJob: ArgoCD cannot
# manage Jobs idempotently and their pods are never pruned. The loop lives in
# the container (POLL_INTERVAL_SECONDS).
#
# WHY LIVENESS AND READINESS POINT AT DIFFERENT PATHS.
# The sibling exporters serve one /health that returns 503 until the first
# cycle completes. That pattern is actively wrong here: the first cycle
# clones the entire fleet, and a single large repo measured 148.6s cold
# (against 1.21s to fetch once mirrored). Across ~111 repos a cold start runs
# far past any sane liveness threshold, so gating liveness on first publish
# would kill the pod mid-clone, forever, without ever completing one. So:
#   /health  -- liveness, 200 as soon as the process is up
#   /ready   -- readiness, 503 until the first successful publish
# The PVC is what makes that survivable; a restart resumes against existing
# mirrors rather than starting the cold pass again.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-activity-exporter
  namespace: git-activity-exporter
  labels:
    app: git-activity-exporter
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  # Publication has no cross-process lease or fencing. The sibling
  # ResourceQuota caps this namespace at one pod; do not attach an HPA or add
  # another poller for this destination prefix.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: git-activity-exporter
  template:
    metadata:
      labels:
        app: git-activity-exporter
    spec:
      # The image runs as uid 1000 (appuser), but a freshly provisioned
      # Longhorn volume mounts root-owned, so the first live cycle failed
      # every clone with "Permission denied" on /data/mirrors/*.git.tmp.
      # fsGroup makes the kubelet chown+setgid the volume to that gid on
      # mount, which is the only part of this the container cannot do for
      # itself.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: exporter
          image: ronaldraygun/git-activity-exporter:0.1.3
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: git-activity-exporter-config
          env:
            - name: FORGE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: git-activity-exporter-forge
                  key: FORGE_TOKEN
            - name: DEST_S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: dashboard-s3-credentials
                  key: S3_ENDPOINT
            - name: DEST_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: dashboard-s3-credentials
                  key: ACCESS_KEY_ID
            - name: DEST_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: dashboard-s3-credentials
                  key: SECRET_ACCESS_KEY
            - name: DEST_S3_BUCKET
              value: "dashboard-site"
            - name: DEST_S3_PREFIX
              value: "git-activity/data"
            # Garage has no per-bucket virtual-host DNS, same as every
            # sibling exporter writing to this bucket.
            - name: DEST_S3_ADDRESSING_STYLE
              value: "path"
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: mirrors
              mountPath: /data/mirrors
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              # git gc and pack-objects on a large mirror are the memory
              # peak, not the Python; pyarrow on a ~5k-row table is noise.
              cpu: "2"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            initialDelaySeconds: 30
            # A cold start legitimately takes far longer than one period;
            # readiness simply stays false until the first publish lands.
            periodSeconds: 30
            failureThreshold: 240
      volumes:
        - name: mirrors
          persistentVolumeClaim:
            claimName: git-activity-exporter-mirrors
      imagePullSecrets:
        - name: docker-hub-registry
