# Reference reflector contract for the author's GitOps deployment.
#
# The GarageKey and Deployment are desired-state resources. The Secret in the
# target namespace is an observed auto-mirror shape, not a Secret to apply:
# Reflector creates and owns it after the Garage operator creates the source
# Secret. It intentionally has no data in this fixture.
---
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageKey
metadata:
  name: dashboard-write-key
  namespace: garage-operator
spec:
  clusterRef:
    name: garage
  name: Dashboard Site Write Key
  secretTemplate:
    name: dashboard-s3-credentials
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: b2-usage-exporter,simplefin-sync,options-downloader-status-exporter,cluster-status,argo-workflows-exporter,commitgraph-dashboard,git-activity-exporter,estate-analytics
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: b2-usage-exporter,simplefin-sync,options-downloader-status-exporter,cluster-status,argo-workflows-exporter,commitgraph-dashboard,git-activity-exporter,estate-analytics
    accessKeyIdKey: ACCESS_KEY_ID
    secretAccessKeyKey: SECRET_ACCESS_KEY
    endpointKey: S3_ENDPOINT
    includeEndpoint: true
  bucketPermissions:
    - bucketRef:
        name: dashboard-site
      read: true
      write: true
---
# Observed output after Reflector reconciles the source Secret. Do not apply
# this object from Git; the reflector controller creates it in this namespace.
apiVersion: v1
kind: Secret
metadata:
  name: dashboard-s3-credentials
  namespace: git-activity-exporter
  annotations:
    reflector.v1.k8s.emberstack.com/reflects: garage-operator/dashboard-s3-credentials
type: Opaque
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-activity-exporter
  namespace: git-activity-exporter
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  template:
    spec:
      containers:
        - name: exporter
          env:
            - name: DEST_S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: dashboard-s3-credentials
                  key: S3_ENDPOINT
            - name: DEST_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: dashboard-s3-credentials
                  key: ACCESS_KEY_ID
            - name: DEST_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: dashboard-s3-credentials
                  key: SECRET_ACCESS_KEY
