services:
  # The profile is opt-in so a normal `docker compose up` does not start a
  # second exporter or create a local destination by accident.
  forgejo-fixture:
    profiles: [self-hosting]
    image: ${EXPORTER_IMAGE:-git-activity-exporter-self-hosting:0.1.41}
    command: [python, /fixture/mock-forgejo.py]
    environment:
      FORGE_OWNER: reuser
      FIXTURE_REPO: /fixtures/reuser-project.git
    volumes:
      - ${FIXTURE_ROOT:-.}:/fixtures:ro
      - ./mock-forgejo.py:/fixture/mock-forgejo.py:ro
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8081/health]
      interval: 1s
      timeout: 2s
      retries: 30

  s3-fixture:
    profiles: [self-hosting]
    image: ${EXPORTER_IMAGE:-git-activity-exporter-self-hosting:0.1.41}
    command: [python, /fixture/mock-s3.py]
    environment:
      # The smoke sends browser-shaped requests with this Host header. The
      # fixture maps the website path to the same objects the S3 API stores.
      WEBSITE_HOST: dashboard.example.test
      WEBSITE_BUCKET: reuser-git-activity
      WEBSITE_SOURCE_PREFIX: exports/reuser
      WEBSITE_PATH_PREFIX: /git-activity/data
    ports:
      - 127.0.0.1::9000
    volumes:
      - ./mock-s3.py:/fixture/mock-s3.py:ro
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:9000/health]
      interval: 1s
      timeout: 2s
      retries: 30

  mirror-volume-init:
    profiles: [self-hosting]
    image: ${EXPORTER_IMAGE:-git-activity-exporter-self-hosting:0.1.41}
    user: "0:0"
    command: [sh, -c, mkdir -p /data/mirrors && chown -R 1000:1000 /data/mirrors]
    volumes:
      - self-hosting-mirrors:/data/mirrors

  exporter:
    profiles: [self-hosting]
    image: ${EXPORTER_IMAGE:-git-activity-exporter-self-hosting:0.1.41}
    depends_on:
      forgejo-fixture:
        condition: service_healthy
      s3-fixture:
        condition: service_healthy
      mirror-volume-init:
        condition: service_completed_successfully
    environment:
      FORGE_BASE_URL: http://forgejo-fixture:8081
      FORGE_OWNER: reuser
      FORGE_TOKEN: ${SMOKE_FORGE_TOKEN}
      GIT_CONFIG_SYSTEM: /etc/git-activity-exporter/gitconfig
      FAMILIES_FILE: /etc/git-activity-exporter/families.yaml
      CLONE_ROOT: /data/mirrors
      DEST_S3_ENDPOINT: http://s3-fixture:9000
      DEST_S3_BUCKET: reuser-git-activity
      DEST_S3_PREFIX: exports/reuser
      DEST_S3_ACCESS_KEY_ID: ${SMOKE_S3_ACCESS_KEY_ID}
      DEST_S3_SECRET_ACCESS_KEY: ${SMOKE_S3_SECRET_ACCESS_KEY}
      DEST_S3_ADDRESSING_STYLE: path
      WINDOW_DAYS: "30"
      SHALLOW_SINCE_DAYS: "40"
      POLL_INTERVAL_SECONDS: "3600"
    volumes:
      - self-hosting-mirrors:/data/mirrors
      - ${FIXTURE_ROOT:-.}:/fixtures:ro
      - ./gitconfig:/etc/git-activity-exporter/gitconfig:ro
      - ./families.yaml:/etc/git-activity-exporter/families.yaml:ro
    ports:
      - 127.0.0.1::8080

volumes:
  # This named volume is the Docker smoke equivalent of the RWO PVC in
  # kubernetes.yaml. The exporter remains a single writer.
  self-hosting-mirrors:
